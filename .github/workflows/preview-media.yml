name: Generate preview media
on:
  workflow_dispatch:
  push:
    paths:
      - 'preview/generate_media.py'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install media tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --quiet numpy opencv-python-headless
      - name: Render preview videos
        run: python preview/generate_media.py
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/assets/*.mp4 preview/assets/*.jpg
          git diff --cached --quiet || (git commit -m "Render video backgrounds for preview" && git push)
