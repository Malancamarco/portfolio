name: Responsive browser audit

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'preview/**'
      - 'tests/responsive-audit.cjs'
      - '.github/workflows/responsive-audit.yml'

permissions:
  contents: read

jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Start local site and test
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/portfolio-http.log 2>&1 &
          sleep 2
          node tests/responsive-audit.cjs
      - name: Upload visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-screenshots
          path: responsive-screenshots/
          if-no-files-found: ignore
